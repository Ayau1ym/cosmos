<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cosmotion – space learning you can move to</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head><body>
<a class="skip" href="#main">Skip to content</a>
<header>
  <h1>Cosmotion</h1>
  <nav aria-label="Main">
    <button data-view="home">Games</button>
    <button data-view="progress">Progress</button>
    <button data-view="settings">Settings</button>
  </nav>
</header>
<main id="main">
  <section id="home" class="view">
    <p class="lead">Learn about space by moving, pointing, or pressing one key. Pick how you want to play:</p>
    <fieldset class="modes"><legend>Play with</legend>
      <label><input type="radio" name="mode" value="mouse" checked> Mouse or touch</label>
      <label><input type="radio" name="mode" value="cam"> Webcam motion</label>
      <label><input type="radio" name="mode" value="switch"> One key (Space = next, Enter = pick)</label>
    </fieldset>
    <div class="cards" id="cards"></div>
  </section>
  <section id="game" class="view" hidden>
    <div class="bar"><button id="quit">Back</button><div id="prompt" role="status" aria-live="polite"></div><div id="score">0/8</div></div>
    <div class="stage"><canvas id="cv" aria-label="Game area"></canvas><video id="cam" muted playsinline></video></div>
    <p id="msg" role="status" aria-live="polite"></p>
  </section>
  <section id="progress" class="view" hidden>
    <h2>Progress</h2><div id="rows"></div>
    <p><button id="dl">Download report (JSON)</button> <button onclick="print()">Print report</button> <button id="reset">Clear progress</button></p>
    <p class="note">Progress stays on this device. Share the report with a teacher or therapist.</p>
  </section>
  <section id="settings" class="view" hidden>
    <h2>Settings</h2>
    <label>Speed <input type="range" id="speed" min="0" max="3" step="0.5"></label>
    <label>Target size <input type="range" id="size" min="0.8" max="1.6" step="0.1"></label>
    <label>Hold time to pick (seconds) <input type="range" id="dwell" min="0.3" max="2" step="0.1"></label>
    <label><input type="checkbox" id="contrast"> High contrast</label>
    <label><input type="checkbox" id="calm"> Calm mode (no movement or flashes)</label>
    <label><input type="checkbox" id="voice"> Read prompts aloud</label>
    <label><input type="checkbox" id="sound"> Sound effects</label>
  </section>
</main>
<script src="app.js"></script>
</body></html>
